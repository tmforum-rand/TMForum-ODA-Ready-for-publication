      - cancelResourceOrderInformationRequiredEvent
      specification: https://github.com/tmforum-apis/TMF652_ResourceOrderManagement/blob/master/TMF652-ResourceOrder-v4.0.0.swagger.json
      apiType: openapi
      id: TMF652
