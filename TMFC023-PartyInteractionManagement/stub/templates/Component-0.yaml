spec:
  componentMetadata:
    description: Party Interaction deals with the initial greeting and welcoming of
      a new contact. This will typically be the first component in a customer experience
      journey, shared by unassisted (self-service, retail kiosk) or assisted (call
      center, retail store) channels. It will identify known parties or new parties
      and react appropriately to propose available actions. It records all the interactions
      for the parties from all channels.
    eTOMs:
    - 1.3.5_Customer_Interaction_Management_v23.0
    - 1.3.5.1_Create_Customer_Interaction_v23.0
    - 1.3.5.2_Update_Customer_Interaction_v23.0
    - 1.3.5.3_Close_Customer_Interaction_v23.0
    - 1.3.5.4_Log_Customer_Interaction_v23.0
    - 1.3.5.6_Track_and_Manage_Customer_Interaction_v23.0
    - 1.3.5.7_Report_Customer_interaction_v23.0
    - 1.6.9_Business_Partner_Interaction_Management_v23.0
    - 1.6.9.1_Log_Business_Partner_Interaction_v23.0
    - 1.6.9.3_Track_and_Manage_Business_Partner_Interaction_v23.0
    - 1.6.9.5_Analyze_&_Report_Business_Partner_Interactions_v23.0
    functionalBlock: PartyManagement
    functionalFrameworkFunctions:
    - 93_Customer_Behavior_Tracking_v23.0
    - 163_Contact_Queuing_v23.0
    - 165_Customer_Support_Collaboration_Access_v23.0
    - 168_Voice_Channel_Contact_Routing_v23.0
    - 189_Customer_Interaction_Information_Capturing_v23.0
    - 191_Customer_Relationship/Context_Event_Data_Accumulation_v23.0
    - 196_Customer_Interaction_Logging_v23.0
    - 239_Recommendation_to_Customer_Notification_v23.0
    - 1041_Partner_Interaction_Journalizing_v23.0
