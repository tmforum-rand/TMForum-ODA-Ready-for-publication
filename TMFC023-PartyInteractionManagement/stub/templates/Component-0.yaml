    - email: components@tmforum.org
      name: Redacted
      url: Redacted
    name: PartyInteractionManagement
    owners:
    - email: Redacted
      name: Redacted
      url: Redacted
    publicationDate: 2024-04-30 00:00:00
    status: specified
    version: 1.1.0
