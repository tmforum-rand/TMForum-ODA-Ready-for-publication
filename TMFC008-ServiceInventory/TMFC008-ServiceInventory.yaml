  componentMetadata:
    id: TMFC008
    name: ServiceInventory
    version: 1.2.0
    description: Service Inventory component is responsible for storage and exposure
      of CFS (Customer Facing Service) that are associated to Product Inventory items.
      It is also responsible for RFS (Resource Facing Service) definition, mapping
      between CFS and RFS and mapping with infrastructure/network resources. Service
      Inventory component has functionality that enables inventory items creation,
      inventory organization, inventory search or filter, inventory monitoring and
      tracking, inventory control and inventory auditing.The minimum check to be performed
      at inventory items creation or update is the global consistency with related
      Service Catalog information.
    publicationDate: 2024-11-12 00:00:00
    status: specified
    functionalBlock: Production
    owners:
    - email: Redacted
      name: Redacted
      url: Redacted
    maintainers:
    - name: Redacted
      email: components@tmforum.org
      url: Redacted
