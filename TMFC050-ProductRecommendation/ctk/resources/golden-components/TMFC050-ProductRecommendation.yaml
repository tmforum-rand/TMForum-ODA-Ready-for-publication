apiVersion: oda.tmforum.org/v1beta4
kind: component
metadata:
  name: components.oda.tmforum.org
spec:
  componentMetadata:
    description: Product Recommendation Management component is responsible for evaluating
      and providing party recommendations offerings based on the history and real-time
      context of a party.
    functionalBlock: IntelligenceManagement
    id: TMFC050
    maintainers:
    - email: components@tmforum.org
      name: Redacted
      url: Redacted
    name: ProductRecommendationManagement
    owners:
    - email: Redacted
      name: Redacted
      url: Redacted
    publicationDate: 2024-12-03
    status: specified
    version: 1.0.0
  coreFunction:
    dependentAPIs:
    - apiType: openapi
      id: TMF620
      name: product-catalog-management-api
      required: true
      resources:
      - catalog:
        - GET
        - GET /id
      - category:
        - GET
        - GET /id
      - productSpecification:
        - GET
        - GET /id
      - productOffering:
        - GET
        - GET /id
      - productOfferingPrice:
