apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Release.Name}}-productinvapi
  labels:
    oda.tmforum.org/componentName: {{.Release.Name}}-{{.Values.component.name}}
spec:
  replicas: 1
  selector:
    matchLabels:
      impl: {{.Release.Name}}-productinvapi
  template:
    metadata:
      labels:
        app: {{.Release.Name}}-{{.Values.component.name}}
        impl: {{.Release.Name}}-productinvapi
        version: {{.Values.api.versionLabel}}
    spec:
      containers:
      - name: {{.Release.Name}}-productinvapi
        image: {{.Values.api.image}}
        imagePullPolicy: {{.Values.image.pullPolicy}}
        env:
        - name: COMPONENT_NAME
          value: {{.Release.Name}}-{{.Values.component.name}}
        - name: PORT
          value: "8637"
        - name: dbhost
          value: {{.Release.Name}}-mongodb
        - name: dbport
          value: "{{.Values.mongodb.port}}"
        - name: dbname
          value: {{.Values.mongodb.database}}
        - name: LOG_LEVEL
          value: "info"
        ports:
        - containerPort: 8637
        startupProbe:
          httpGet:
            path: /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/productInventory/v5/product
            port: 8637
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/productInventory/v5/product
            port: 8637
          initialDelaySeconds: 10
          periodSeconds: 5
