component:
  id: TMFC006
  name: servicecatalogmanagement
  functionalBlock: Production
  publicationDate: "2024-11-12T00:00:00.000Z"
  version: "1.3.0"
  storageClassName: default
  apipolicy:
    apiKeyVerification:
      enabled: false
      location: "header"
    rateLimit:
      enabled: false
      identifier: "IP"
      limit: "6"
      interval: "pm"
    quota:
      identifier: ""
      limit: ""
    OASValidation:
      requestEnabled: false
      responseEnabled: false
      allowUnspecifiedHeaders: false
      allowUnspecifiedQueryParams: false
      allowUnspecifiedCookies: false
    CORS:
      enabled: false
      allowCredentials: false
      allowOrigins: "https://allowed-origin.com"
      handlePreflightRequests:
        enabled: false
        allowHeaders: "Accept, Content-Type"
        allowMethods: "GET, POST"
        maxAge: 36000
    template: ""

security:
  canvasSystemRole: canvasRole

mongodb:
  port: 27017
  database: tmf

image:
  pullPolicy: Always

servicecatalogapi:
  image: akumartmf/servicecatalogapi:0.4
  versionLabel: servicecatalogapi-0.4
  otlp:
    console:
      enabled: false
    protobuffCollector:
      enabled: false
      url: http://observability-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces

servicequalityapi:
  image: akumartmf/servicequalityapi:0.1
  versionLabel: servicequalityapi-0.1
  otlp:
    console:
      enabled: false
    protobuffCollector:
      enabled: false
      url: http://observability-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces

metrics:
  image: akumartmf/servicecatalogmetrics:0.2

initialization:
  image: akumartmf/servicecataloginitialization:0.1

canvasinfo:
  host: info.canvas.svc.cluster.local
  basepath: /
