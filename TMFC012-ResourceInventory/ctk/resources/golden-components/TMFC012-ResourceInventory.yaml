  componentMetadata:
    description: Resource Inventory component is responsible for accounting for resources
      (all inputs - including stock, parts, assets, production components etc.) that
      are owned and/or held for allocation and/or use by the organization. Resource
      Inventory component has functionality that includes inventory items creation,
      inventory organization, inventory search or filter, inventory monitoring and
      tracking, inventory control (organization, re-stock management etc.) and inventory
      auditing. The minimum check to be performed at inventory items creation or update
      is the global consistency with related Resource Catalog information.
    eTOMs:
    - 1.5.4_Resource_Support_Readiness_v23.0
    - 1.5.4.5_Manage_Resource_Inventory_v23.0
