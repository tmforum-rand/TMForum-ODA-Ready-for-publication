spec:
  componentMetadata:
    description: The SOM is the entry point of the Production Domain. It oversees
      Customer-Facing-Service (CFS) delivery of resources (network and service platforms
      equipment). The SOM exposes in particular the API ServiceOrder. It is triggered
      when the Product Order Orchestration Management component calls this API to
      request CFS delivery. To achieve delivery of a CFS, the SOM orchestrates the
      CFS delivery process which. Identifies possible RFS and chooses one, using the
      catalog and technical inventory. Selects the resources (servers, equipment,
      etc.) and their instances. Requests the ROM to update selected resource instances
      to deliver CFS. Request sent to the ROM contain the CFS and the list of configured
      resource instances to update.
    eTOMs:
    - 1.4.5_Service_Configuration_&_Activation_v21.5
    - 1.4.5.1_Design_Solution_v21.5
    - 1.4.5.2_"Allocate_Specific_Service_Parameters_to_Services_v21.5
    - 1.4.5.3_Track_&_Manage_Service_Provisioning_v21.5
    - 1.4.5.4_Implement,_configure_&_activate_service_v21.5
    - 1.4.5.6_"Issue_Service_Order_v21.5
    - 1.4.5.7_Report_service_provisioning_v21.5
    - 1.4.5.8_Close_Service_Order_v21.5
    - 1.5.6_Resource_Provisioning_v21.5
    - 1.5.6.7_"Issue_Resource_Order_v21.5
