apiVersion: batch/v1
kind: Job
metadata:
  name: {{.Release.Name}}-producttestmanagementinitialization
  labels:
    oda.tmforum.org/componentName: {{.Release.Name}}-{{.Values.component.name}}
spec:
  template:
    metadata:
      labels:
        app: {{.Release.Name}}-producttestmanagementinitialization
    spec:
      containers:
      - name: {{.Release.Name}}-producttestmanagementinitialization
        image: akumartmf/producttestmanagementinitialization:0.1
        env:
        - name: RELEASE_NAME
          value: {{.Release.Name}}
        - name: COMPONENT_NAME
          value: {{.Release.Name}}-{{.Values.component.name}}
        imagePullPolicy: Always
      restartPolicy: OnFailure
  backoffLimit: 10
