apiVersion: oda.tmforum.org/v1beta4
kind: Component
metadata:
  labels:
    oda.tmforum.org/componentName: '{{.Release.Name}}-{{.Values.component.name}}'
  name: '{{.Release.Name}}-{{.Values.component.name}}'
spec:
  componentMetadata:
    description: Provides standardized mechanism for product usage management such
      as creation, update, retrieval, import and export of a collection of usages.
      It allows a service provider to 1) retrieve usage generated by a partner service
      platform in order to rate it and 2) to provide rated usage to a partner for
      consumption follow-up purposes.
    eTOMs:
    - 1.2.16_Product_Usage_Management_v23.0
    - 1.2.16.1_Product_Usages_v23.0
    - 1.2.16.1.1_Add_Product_Usage_Data_v23.0
    - 1.2.16.1.2_Assign_Product_Usage_Price_v23.0
    - 1.2.16.2_Guide_and_Assign_Product_Usages_v23.0
    - 1.2.16.2.1_Assign_Product_Usages_v23.0
    - 1.2.16.2.2_Distribute_Product_Usage_v23.0
    - 1.2.16.2.3_Guide_Product_Usages_v23.0
    - 1.2.16.3_Mediate_Product_Usages_v23.0
    - 1.2.16.3.1_Edit_Product_Usages_v23.0
    - 1.2.16.3.2_Reformat_Product_Usages_v23.0
    - 1.2.16.4_Report_Product_Usage_Records_v23.0
    - 1.2.16.4.1_Generate_Product_Usage_Report_v23.0
    - 1.2.16.4.2_Investigate_Product_Usage_Related_Problem_v23.0
    - 1.2.16.4.3_Support_Product_Usage_Related_Process_v23.0
    - 1.2.17_Product_Rating_&_Rate_Assignment_v23.0
    - 1.2.17.1_Perform_Rating_v23.0
    - 1.2.17.2_Aggregate_Items_For_Rate_Assignment_v23.0
    - 1.2.17.3_"Manage_Customer_Assignment_Hierarchy_v23.0
    - 1.2.17.4_Provide_Advice_of_Rate_v23.0
    - 1.2.17.5_Apply_Rate_Level_Discounts_v23.0
    functionalBlock: CoreCommerce
    functionalFrameworkFunctions:
    - 253_Customer_Usage_and_Charges_Report_Access_v23.0
    - 55_Price_and_Discount_Calculation_v23.0
    - 125_Charging_Event_Accumulation_v23.0
    - 126_Event_Charge/Credit_Calculation_v23.0
    - 127_Calculated_Charges/Credits_Proration_v23.0
    - 128_Late_Arrival_Usage_Charges/Credits_Recalculation_v23.0
    - 186_Charging/Rating_Recalculation_v23.0
    - 300_Discounts_Calculation_v23.0
    - 67_Usage_Summary_and_Details_Presentation_v23.0
    - 85_Billing_Event_Processing_Distribution_v23.0
    - 86_Billing_Event_Processing_Enrichment_v23.0
    id: TMFC040
    maintainers:
    - email: components@tmforum.org
      name: Redacted
      url: Redacted
    name: ProductUsageManagement
    owners:
    - email: Redacted
      name: Redacted
      url: Redacted
    publicationDate: 2024-10-22
    status: specified
    version: 1.1.0
  coreFunction:
    dependentAPIs:
    - apiType: openapi
      name: party-management-api
      specification:
      - url: https://tmf-open-api-table-documents.s3.eu-west-1.amazonaws.com/OpenApiTable/TMF632_Party/4.0.0/swagger/TMF632_Party_Management_API_v4.0.0_swagger.json
        version: v4.0.0
    - apiType: openapi
