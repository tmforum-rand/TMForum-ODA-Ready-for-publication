apiVersion: oda.tmforum.org/v1beta4
kind: Component
metadata:
  labels:
    oda.tmforum.org/componentName: '{{.Release.Name}}-{{.Values.component.name}}'
  name: '{{.Release.Name}}-{{.Values.component.name}}'
spec:
  componentMetadata:
    description: Resource Order Management Component manages the end-to-end lifecycle
      of a resource  order request. This includes validating resource availability
      as well as the  resource order request. Other functionality includes resource
      order assurance,  resource order decomposition and resource order tracking,
      along with orchestrating  the activation and the test and turn-up processes.
    eTOMs:
    - 1.5.5_Resource_Order_Management_v23
    - 1.5.5.6_Manage_Resource_Order_Capture_v23
    - 1.5.5.7_Manage_Resource_Work_Order_v23
    - 1.5.5.8_Manage_Resource_Order_Fulfilment_v23
    - 1.5.5.9_Manage_Resource_Order_Picking/Packing_v23
    - 1.5.5.12_Manage_Resource_Order_Tracking_v23
    - 1.5.5.13_Manage_Resource_Order_Closure_v23
    functionalBlock: Production
    functionalFrameworkFunctions:
    - 448_Resource_Availability_Validation_v23
    - 568_Resource_Availability_Checking_v23
    - 569_Network_Facility_Selection_v23
    - 490_Resource_Order_Data_Collection_v23
    - 491_Resource_Order_Initiation_v23
    - 495_Resource_Order_Completion_v23
    - 503_Resource_Order_Validation_v23
    - 452_Resource_Commissioning_v23
    - 492_Resource_Order_Management_v23
    - 493_Resource_Order_Dependency_Manageme_v23
    - 494_Resource_Order_Jeopardy_Tracking_v23
    - 529_Tactical_Resource_Planning_v23
    - 958_Resource_Task_Decomposition_v23
    - 961_Resource_Work_Item_Sequence_Execution_v23
    - 496_Resource_Order_Tracking_v23
    - 497_Resource_Orcer_Status_Reporting_v23
    - 488_Resource_Parameter_Allocation_v23
    - 487_Resource_Parameter_Reservation_v23
    - 16_Fallout_Automated_Correction_v23
    - 17_Fallout_Correction_Information_Collection_v23
    - 19_Fallout_Manual_Correction_Queuing_v23
    - 21_Fallout_Orchestration_v23
    - 24_Pre-populated_Fallout_Information_Presentation_v23
    - 756_Fallout_Rule_Based_Error_Correction_v23
    - 18_Fallout_Management_to_Fulfillment_Application_Accessing_v23
    - 20_Fallout_Notification_v23
    - 22_Fallout_Reporting_v23
    - 23_Fallout_Dashboard_System_Log-in_Accessing_v23
    id: TMFC011
    maintainers:
    - email: components@tmforum.org
      name: Redacted
      url: Redacted
    name: ResourceOrderManagement
    owners:
    - email: Redacted
      name: Redacted
      url: Redacted
    status: Pre-production
    version: 1.1.0
