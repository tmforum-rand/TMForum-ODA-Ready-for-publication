    name: PartyManagement
    version: 2.1.0
    description: 'The Party Management component is responsible for the capture, validation
      and management of Parties. A Party may be an individual or organization that
      has a relationship with an enterprise. In this context it is responsible for
      the end-to-end lifecycle of: Individual, Organization and its related sub-entities,
      Contact Medium, Currency and tax exemption certificates, Identification, and
      Community.'
