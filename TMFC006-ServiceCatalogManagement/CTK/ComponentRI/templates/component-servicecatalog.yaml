apiVersion: oda.tmforum.org/v1
kind: Component
metadata:
  name: {{.Release.Name}}-{{.Values.component.name}}
  labels:
    oda.tmforum.org/componentName: {{.Release.Name}}-{{.Values.component.name}}
  annotations:
    webhookconverted: Webhook converted From oda.tmforum.org/v1beta3 to oda.tmforum.org/v1
spec:
  componentMetadata:
    id: {{.Values.component.id}}
    name: {{.Values.component.name}}
    version: {{.Values.component.version}}
    description: >-
      Simple Service Catalog ODA-Component from Open-API reference
      implementation.
    functionalBlock: {{.Values.component.functionalBlock}}
    publicationDate: {{.Values.component.publicationDate}}
    status: specified
    maintainers:
      - name: TM Forum
        email: components@tmforum.org
    owners:
      - name: TM Forum
        email: components@tmforum.org
  coreFunction:
    exposedAPIs:
      - name: servicecatalogmanagement
        id: TMF633
        specification:
          - url: >-
              https://raw.githubusercontent.com/tmforum-apis/TMF633_ServiceCatalog/master/TMF633-ServiceCatalog-v4.0.0.swagger.json
        implementation: {{.Release.Name}}-servicecatalogapi
        apiType: openapi
        path: >-
          /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/serviceCatalogManagement/v4
        developerUI: >-
          /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/serviceCatalogManagement/v4/docs
        port: 8080
        gatewayConfiguration: {}
      - name: servicequalitymanagementmanagement
        specification:
          - url: >-
              https://raw.githubusercontent.com/tmforum-apis/TMF657_ServiceQualityManagement/master/TMF657-ServiceQualityManagement-v4.0.0.swagger.json
        implementation: {{.Release.Name}}-servicequalityapi
        apiType: openapi
        path: >-
          /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/serviceQualityManagement/v4
        developerUI: >-
          /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/serviceQualityManagement/v4/docs
        port: 8080
        gatewayConfiguration: {}
    dependentAPIs:
      []
  eventNotification:
    publishedEvents: []
    subscribedEvents: []
  managementFunction:
    exposedAPIs: []
    dependentAPIs: []
  securityFunction:
    canvasSystemRole: {{.Values.security.controllerRole}}
    exposedAPIs:
      - name: partyrole
        id: TMF669
        specification:
          - url: >-
              https://raw.githubusercontent.com/tmforum-apis/TMF669_PartyRole/master/TMF669-PartyRole-v4.0.0.swagger.json
        implementation: {{.Release.Name}}-partyroleapi
        apiType: openapi
        path: >-
          /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/partyRoleManagement/v4
        developerUI: >-
          /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/partyRoleManagement/v4/docs
        port: 8080
        gatewayConfiguration: {}
    
  
