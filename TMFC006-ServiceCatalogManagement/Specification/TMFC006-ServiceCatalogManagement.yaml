  componentMetadata:
    id: TMFC006
    name: ServiceCatalogManagement
    version: 1.2.0
    description: The Service Catalog Management component is responsible for organizing
      the collection of service specifications that identify and define all requirements
      of a service that can be performed. This component has the functionality that
      enables presentation of a customer-facing view so users are able to search and
      select services they need, as well as a technical view to enable definition
      and setup of what is needed to deliver service specifications (Customer Facing
      Service Specifications (CFSSs) and Resource Facing Service Specifications (RFSSs))
      contained in the service catalog. The Service Catalog Management component has
      functionalities that include creation of new service specifications, managing
      service specifications, administering the lifecycle of services, describing
      relationships between service specification attributes, reporting on service
      specifications and their changes, and facilitating easy and systematic indexing
      and access to services, as well as facilitating automation of the service delivery
      process.
    publicationDate: 2024-11-12 00:00:00
